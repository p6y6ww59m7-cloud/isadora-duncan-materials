<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="#f5f0e7"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="80" y="105" font-size="22" fill="#7d6040">片段 07 / 图表 04 · 依据资料整理的关系示意</text><text x="80" y="172" font-size="40" fill="#242722">1913年的失去 · 4</text><rect x="80" y="245" width="368" height="145" rx="10" fill="#ffffff" stroke="#c9bba6"/><text x="264" y="310.0" text-anchor="middle" font-size="30" fill="#242722">得知噩耗</text><path d="M458 315 h25 m-8 -7 l8 7 -8 7" fill="none" stroke="#9a6d2e" stroke-width="3"/><rect x="494" y="245" width="368" height="145" rx="10" fill="#ffffff" stroke="#c9bba6"/><text x="678" y="310.0" text-anchor="middle" font-size="30" fill="#242722">难以理解</text><path d="M872 315 h25 m-8 -7 l8 7 -8 7" fill="none" stroke="#9a6d2e" stroke-width="3"/><rect x="908" y="245" width="368" height="145" rx="10" fill="#ffffff" stroke="#c9bba6"/><text x="1092" y="310.0" text-anchor="middle" font-size="30" fill="#242722">无法哭泣</text><text x="80" y="495" font-size="24" fill="#3e453f">她描述自己无法理解发生了什么，起初也没有哭出来。</text><text x="80" y="650" font-size="20" fill="#697267">来源：《My Life》1927年作品；此扫描本为1928年印次 · PDF第329页</text></g></svg>